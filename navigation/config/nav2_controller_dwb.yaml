# ============================================================
# NAV2 PARAMS - v5
# PROBLEM SEEN IN RVIZ:
#   Inflation radius was 0.40/0.45m — in a corridor map this
#   completely floods narrow passages with lethal/inscribed cost.
#   Robot sees NO valid path → planner fails → BT triggers spin recovery.
#
# CORRECT APPROACH:
#   - Inflation must be just slightly larger than robot half-width
#   - Robot half-width = 0.15m, so inflation = 0.20~0.22m is enough
#   - Spin fix comes from DWB critics + min_speed_theta=0, NOT inflation
#
# SPINNING ROOT CAUSE (without large inflation):
#   1. PathDist:80 >> ObstacleFootprint:0.2  (path obsession > safety)
#   2. min_speed_theta:0.1 forced rotations even on straight paths
#   3. BaseObstacle used point check — full footprint never tested
#   4. sim_time too short to see upcoming obstacles in trajectory rollout
# ============================================================

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""

amcl:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: /scan_raw
    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    min_particles: 500
    max_particles: 2000

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.15
    alpha4: 0.15
    alpha5: 0.2

    laser_model_type: "likelihood_field"
    max_beams: 60
    laser_max_range: 10.0
    laser_min_range: 0.2
    laser_likelihood_max_dist: 2.5
    do_beamskip: true
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.4
    sigma_hit: 0.2
    z_hit: 0.6
    z_max: 0.05
    z_rand: 0.35
    z_short: 0.05
    lambda_short: 0.1

    update_min_d: 0.2
    update_min_a: 0.3
    resample_interval: 2

    recovery_alpha_fast: 0.05
    recovery_alpha_slow: 0.001

    transform_tolerance: 0.5
    tf_broadcast: true
    save_pose_rate: 0.5

    pf_err: 0.05
    pf_z: 0.99

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.01
    controller_plugins: ["FollowPath"]
    progress_checker_plugin: progress_checker
    goal_checker_plugins: ["goal_checker"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 30.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 6.28
      stateful: True

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      # Velocity limits — conservative for narrow corridor map
      min_vel_x: -0.10          # Limit reverse to reduce backward-spin attempts
      max_vel_x: 0.18
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.40       # Slightly reduced — avoids aggressive spinning
      min_speed_xy: 0.0
      max_speed_xy: 0.18
      min_speed_theta: 0.0      # KEY FIX: was 0.1 — forced rotation on every trajectory

      acc_lim_x: 0.5
      acc_lim_y: 0.0
      acc_lim_theta: 0.8
      decel_lim_x: -0.5
      decel_lim_y: 0.0
      decel_lim_theta: -0.8

      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20

      sim_time: 2.5             # Extended lookahead — sees obstacles earlier in rollout
      linear_granularity: 0.05
      angular_granularity: 0.025
      short_circuit_trajectory_evaluation: true
      stateful: true

      critics:
        - Oscillation
        - ObstacleFootprint    # KEY FIX: full footprint collision check vs point-only BaseObstacle
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist

      # KEY FIX: Rebalanced weights
      # Before: PathDist(80) >> ObstacleFootprint(0.2) — robot forced into walls chasing path
      # Now: obstacle score is competitive; robot will deviate from path to stay safe
      ObstacleFootprint.scale: 20.0   # Strong obstacle penalty (was BaseObstacle: 0.2)
      PathAlign.scale: 6.0            # Moderate path alignment
      PathAlign.forward_point_distance: 0.3
      GoalAlign.scale: 3.0
      GoalAlign.forward_point_distance: 0.3
      PathDist.scale: 28.0            # KEY FIX: was 80.0 — no longer drowns obstacle cost
      GoalDist.scale: 18.0            # Slightly reduced from 32.0
      Oscillation.scale: 15.0         # Stronger oscillation penalty to damp spin loops

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 15.0
      publish_frequency: 15.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      transform_tolerance: 0.5
      footprint: "[[-0.18,-0.15],[-0.18,0.15],[0.18,0.15],[0.18,-0.15]]"
      footprint_padding: 0.01
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: True
          marking: True
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          inf_is_valid: true
          observation_persistence: 0.0
          expected_update_rate: 15.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        # Robot half-width = 0.15m
        # 0.20m = just enough clearance for DWB footprint scoring
        # Larger values (0.40+) flood narrow corridors → no valid path → spin recovery
        inflation_radius: 0.20
        cost_scaling_factor: 3.5      # Steeper gradient = sharp cost drop-off from walls

      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      resolution: 0.05
      transform_tolerance: 0.5
      track_unknown_space: true
      footprint: "[[-0.18,-0.15],[-0.18,0.15],[0.18,0.15],[0.18,-0.15]]"
      footprint_padding: 0.01
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: True
        map_subscribe_transient_local: True

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: True
          marking: True
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          inf_is_valid: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        # Slightly larger than local so global planner routes through
        # passable corridors — but still narrow-corridor safe
        inflation_radius: 0.22
        cost_scaling_factor: 3.5

      always_send_full_costmap: True

planner_server:
  ros__parameters:
    use_sim_time: False
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.1
      use_astar: true
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: False
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.3
    rotational_acc_lim: 0.8
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.18, 0.0, 0.40]
    min_velocity: [-0.10, 0.0, -0.40]
    max_accel: [0.5, 0.0, 0.8]
    max_decel: [-0.5, 0.0, -0.8]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: False
    autostart: True
    bond_timeout: 30.0
    node_names:
      - map_server
      - amcl

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: False
    autostart: True
    bond_timeout: 30.0
    node_names:
      - controller_server
      - planner_server
      - smoother_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
