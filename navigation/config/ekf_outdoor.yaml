navsat_transform:
  ros__parameters:
    use_sim_time: false
    frequency: 30.0
    delay: 3.0
    magnetic_declination_radians: 0.04
    # When use_odometry_yaw is enabled below, navsat_transform uses the local
    # EKF heading instead of the raw GPS IMU quaternion. This avoids a fixed
    # heading bias from GPS IMU mounting or ENU/NED mismatches.
    yaw_offset: 0.0
    zero_altitude: true
    broadcast_utm_transform: true
    broadcast_utm_transform_as_parent_frame: true
    publish_filtered_gps: true
    use_odometry_yaw: true
    wait_for_datum: false
