                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_nodelay: false
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 15
    imu0_remove_gravitational_acceleration: true

    # Fuse the same robot-heading-corrected GPS IMU in the global filter.
    # NavSat consumes the compass-converted IMU topic through the launch remap
    # so OSM georeferencing does not shift when the robot heading needs an
    # extra correction.
    imu1: /gps/imu_heading
