    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: map

    # odom0 / imu0 / imu1 / base_link_frame are overridden at launch from
    # wheel_odom_topic, base_imu_topic, heading_imu_topic and base_frame.
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true, true, false,
