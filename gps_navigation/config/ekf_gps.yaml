                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu1_nodelay: false
    imu1_differential: false
    imu1_relative: false
    imu1_queue_size: 10
    imu1_remove_gravitational_acceleration: true

    pose0: /odometry/gps
    pose0_config: [true, true, false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    pose0_queue_size: 10
    pose0_differential: false
    pose0_relative: false
    # Use GPS reported covariance to maintain stable map frame
