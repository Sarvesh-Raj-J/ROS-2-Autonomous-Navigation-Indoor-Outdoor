navsat_transform:
  ros__parameters:
    use_sim_time: false
    frequency: 30.0
    delay: 3.0
    magnetic_declination_radians: 0.0
    # NavSat consumes /gps/imu_compass through the launch remap so UTM, /map,
    # and OSM stay earth-aligned. Robot-only visual heading correction is
    # applied separately on /gps/imu_heading.
    yaw_offset: 0.0
    zero_altitude: true
    broadcast_utm_transform: true
    broadcast_utm_transform_as_parent_frame: true
    publish_filtered_gps: true
    use_odometry_yaw: false
    wait_for_datum: false
