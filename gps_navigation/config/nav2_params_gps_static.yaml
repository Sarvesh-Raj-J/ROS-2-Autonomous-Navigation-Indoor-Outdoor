# Nav2 parameters for outdoor GPS waypoint navigation.
# Sensors used here: wheel odometry, IMUs, GPS, and the depth camera point cloud.

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 100
    default_server_timeout: 30000
    navigator_plugins: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"
    # Use the package's replanning trees so outdoor GPS navigation can clear
    # costmaps and recompute paths without unsafe spin/back-up recoveries.
    default_nav_to_pose_bt_xml: @BT_DIR@/navigate_no_spin.xml
    default_nav_through_poses_bt_xml: @BT_DIR@/navigate_through_poses_no_spin.xml
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0
    odom_topic: /odometry/filtered
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.01
    failure_tolerance: 3.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      # Abort/recover sooner when the safety filter holds the robot near a wall.
      movement_time_allowance: 20.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      # The GPS reports about 3-4 m horizontal sigma on this platform. A
      # tighter tolerance makes Nav2 drive correctly, then hunt around the
      # destination because localization cannot prove it reached a 1 m target.
      xy_goal_tolerance: 3.5
      # Outdoor delivery goals are positional. Ignore the final dragged RViz
      # arrow yaw so the robot stops instead of searching left/right at the
      # destination.
      yaw_goal_tolerance: 6.28
      stateful: True
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 20
      model_dt: 0.1
      batch_size: 200
      iteration_count: 1
      vx_std: 0.08
      vy_std: 0.0
      wz_std: 0.28
      vx_max: 0.16
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 0.45
      motion_model: "DiffDrive"
      prune_distance: 2.0
      transform_tolerance: 0.5
      temperature: 0.3
      gamma: 0.015
      visualize: false
      retry_attempt_limit: 1
      regenerate_noises: false

      critics: [
        "ConstraintCritic",
        "CostCritic",
        "ObstaclesCritic",
        "GoalCritic",
        "PathAlignCritic",
        "PathFollowCritic",
        "PathAngleCritic",
        "PreferForwardCritic",
        "TwirlingCritic"
      ]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 35.0
        critical_cost: 180.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        inflation_layer_name: "inflation_layer"
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 2.5
        critical_weight: 25.0
        consider_footprint: true
        collision_cost: 1000000.0
        collision_margin_distance: 0.12
        near_goal_distance: 1.0
        inflation_radius: 0.45
        cost_scaling_factor: 2.5
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 1.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.5
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 12
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 6
        threshold_to_consider: 1.0
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.2
        mode: 0
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        threshold_to_consider: 0.5
      TwirlingCritic:
        enabled: true
        twirling_cost_power: 1
        twirling_cost_weight: 12.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      transform_tolerance: 2.0
      footprint: "[[-0.18,-0.15],[-0.18,0.15],[0.18,0.15],[0.18,-0.15]]"
      footprint_padding: 0.05
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: True
        # Use LiDAR by default outdoors. Depth point clouds are often noisy in
        # sunlight and can cause the controller to rotate in place without
        # ever committing to forward motion.
        observation_sources: lidar scan_raw
        lidar:
          topic: /scan
          data_type: LaserScan
          clearing: True
          marking: True
          obstacle_min_range: 0.0
          obstacle_max_range: 5.0
          raytrace_min_range: 0.0
          raytrace_max_range: 6.0
          inf_is_valid: true
          observation_persistence: 0.8
          expected_update_rate: 0.0
        scan_raw:
          topic: /scan_raw
          data_type: LaserScan
          clearing: True
          marking: True
          obstacle_min_range: 0.0
          obstacle_max_range: 5.0
          raytrace_min_range: 0.0
          raytrace_max_range: 6.0
          inf_is_valid: true
          observation_persistence: 0.8
          expected_update_rate: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: True
        inflation_radius: 0.45
        cost_scaling_factor: 2.5
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 3.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_footprint
      # Static global map mode: keep a fixed world model for buildings/no-go
      # regions, but do not reject GPS-offset starts that land just outside
      # an OSM road corridor.
      rolling_window: false
      origin_x: -100.0
      origin_y: -100.0
      width: 200
      height: 200
      resolution: 0.1
      transform_tolerance: 2.0
      track_unknown_space: true
      footprint: "[[-0.18,-0.15],[-0.18,0.15],[0.18,0.15],[0.18,-0.15]]"
      footprint_padding: 0.05
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: True
        map_topic: /map
        track_unknown_space: true
        unknown_cost_value: 255
        trinary_costmap: true
        lethal_cost_threshold: 65
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: True
        observation_sources: lidar scan_raw
        lidar:
          topic: /scan
          data_type: LaserScan
          clearing: True
          marking: True
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          obstacle_min_range: 0.0
          obstacle_max_range: 8.0
          raytrace_min_range: 0.0
          raytrace_max_range: 10.0
          inf_is_valid: true
        scan_raw:
          topic: /scan_raw
          data_type: LaserScan
          clearing: True
          marking: True
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          obstacle_min_range: 0.0
          obstacle_max_range: 8.0
          raytrace_min_range: 0.0
          raytrace_max_range: 10.0
          inf_is_valid: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: True
        inflation_radius: 0.55
        cost_scaling_factor: 2.5
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: False
    expected_planner_frequency: 0.5
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 1.0
      allow_unknown: false
      use_astar: true

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: False
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.45
    min_rotational_vel: 0.1
    rotational_acc_lim: 1.5
    behavior_plugins:
      - spin
      - backup
      - drive_on_heading
      - wait
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 10
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: True
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 30.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.18, 0.0, 0.35]
    min_velocity: [0.0, 0.0, -0.35]
    max_accel: [0.35, 0.0, 4.0]
    max_decel: [-0.45, 0.0, -4.0]
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: False
    autostart: True
    bond_timeout: 30.0
    node_names:
      - controller_server
      - planner_server
      - smoother_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
